<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>暗夜突围 NightBreak</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #05060a; font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; color: #e8ecf3; user-select: none; }
  #game { display: block; position: absolute; top: 0; left: 0; touch-action: none; }

  /* 顶部 HUD */
  #hud { position: absolute; top: 0; left: 0; right: 0; padding: 10px 14px; pointer-events: none; z-index: 5; }
  .bar { position: relative; height: 14px; background: rgba(255,255,255,0.08); border-radius: 8px; overflow: hidden; border: 1px solid rgba(255,255,255,0.12); }
  .bar > i { position: absolute; left: 0; top: 0; bottom: 0; display: block; border-radius: 8px; transition: width .12s linear; }
  #hpBar > i { background: linear-gradient(90deg, #ff4d6d, #ff8fa3); box-shadow: 0 0 12px #ff4d6d; }
  #xpBar { height: 8px; margin-top: 6px; }
  #xpBar > i { background: linear-gradient(90deg, #4dd0ff, #8affd6); box-shadow: 0 0 10px #4dd0ff; }
  #stats { display: flex; gap: 14px; margin-top: 8px; font-size: 13px; letter-spacing: .5px; }
  #stats b { color: #ffe27a; font-weight: 700; }
  #stats span { color: #9aa6b8; }
  #lvBadge { position: absolute; top: 8px; right: 12px; font-size: 12px; color: #8affd6; text-align: right; line-height: 1.5; }

  /* 遮罩层（升级 / 死亡 / 开始） */
  .overlay { position: absolute; inset: 0; z-index: 20; display: none; flex-direction: column; align-items: center; justify-content: center;
    background: radial-gradient(circle at 50% 40%, rgba(20,24,40,.7), rgba(5,6,10,.92)); backdrop-filter: blur(3px); padding: 24px; text-align: center; }
  .overlay.show { display: flex; }
  .overlay h1 { font-size: 30px; letter-spacing: 4px; margin-bottom: 6px; text-shadow: 0 0 20px rgba(77,208,255,.6); }
  .overlay p.sub { color: #8a93a6; font-size: 13px; margin-bottom: 22px; letter-spacing: 1px; }

  /* 升级卡片 */
  #cards { display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; max-width: 760px; }
  .card { width: 200px; background: linear-gradient(160deg, rgba(40,48,72,.95), rgba(18,22,38,.95)); border: 1px solid rgba(120,160,255,.25);
    border-radius: 14px; padding: 18px 16px; cursor: pointer; transition: transform .12s, box-shadow .12s, border-color .12s; pointer-events: auto; }
  .card:hover, .card:active { transform: translateY(-4px); border-color: rgba(138,255,214,.6); box-shadow: 0 8px 30px rgba(77,208,255,.18); }
  .card .icon { font-size: 30px; margin-bottom: 8px; }
  .card .name { font-size: 16px; font-weight: 700; margin-bottom: 4px; color: #ffe27a; }
  .card .lvl { font-size: 11px; color: #4dd0ff; margin-bottom: 8px; }
  .card .desc { font-size: 12px; color: #aab4c6; line-height: 1.5; }

  /* 稀有度边框 */
  .card.r-common  { border-color: rgba(200,208,220,.35); }
  .card.r-rare    { border-color: rgba(77,208,255,.55);  box-shadow: 0 0 20px rgba(77,208,255,.12); }
  .card.r-epic    { border-color: rgba(176,102,255,.6);  box-shadow: 0 0 22px rgba(176,102,255,.16); }
  .card.r-legend  { border-color: rgba(255,226,122,.7);  box-shadow: 0 0 26px rgba(255,226,122,.2); }
  .card.r-common  .name { color: #e8ecf3; }
  .card.r-rare    .name { color: #4dd0ff; }
  .card.r-epic    .name { color: #c89bff; }
  .card.r-legend  .name { color: #ffe27a; }

  /* 死亡统计 */
  #goStats { display: grid; grid-template-columns: auto auto; gap: 8px 24px; margin: 14px 0 24px; font-size: 15px; }
  #goStats .k { color: #8a93a6; text-align: right; }
  #goStats .v { color: #ffe27a; font-weight: 700; text-align: left; }

  .btn { pointer-events: auto; background: linear-gradient(90deg, #4dd0ff, #8affd6); color: #06121a; border: none; border-radius: 10px;
    padding: 12px 30px; font-size: 16px; font-weight: 700; letter-spacing: 2px; cursor: pointer; box-shadow: 0 6px 20px rgba(77,208,255,.35); }
  .btn:active { transform: translateY(2px); }

  /* 摇杆（触屏拖动用，保留作为备选） */
  #joy { position: absolute; z-index: 8; width: 120px; height: 120px; border-radius: 50%; border: 2px solid rgba(255,255,255,.18);
    background: rgba(255,255,255,.05); display: none; pointer-events: none; transform: translate(-50%,-50%); }
  #joy i { position: absolute; left: 50%; top: 50%; width: 54px; height: 54px; border-radius: 50%; transform: translate(-50%,-50%);
    background: rgba(138,255,214,.4); border: 2px solid rgba(138,255,214,.8); }

  /* ============ 手游操作界面 ============ */
  /* 底部控制区容器 */
  #controls { position: absolute; left: 0; right: 0; bottom: 0; z-index: 10; display: none;
    padding: 18px 22px 28px; justify-content: space-between; align-items: flex-end; pointer-events: none; }
  #controls.show { display: flex; }

  /* 左边：圆盘方向控制 */
  .direction-disk { position: relative; width: 170px; height: 170px; pointer-events: auto;
    border-radius: 50%; background: radial-gradient(circle at 50% 50%, rgba(255,255,255,.06), rgba(255,255,255,.02));
    border: 2px solid rgba(138,255,214,.25); box-shadow: inset 0 0 30px rgba(77,208,255,.08); }
  .direction-disk::before { content: ''; position: absolute; inset: 18px; border-radius: 50%;
    border: 1px dashed rgba(255,255,255,.12); }
  .dir-btn { position: absolute; width: 52px; height: 52px; border-radius: 50%;
    background: linear-gradient(160deg, rgba(40,56,90,.85), rgba(20,28,48,.9));
    border: 1.5px solid rgba(77,208,255,.4); color: #8affd6; font-size: 22px; font-weight: 700;
    display: flex; align-items: center; justify-content: center; cursor: pointer;
    box-shadow: 0 4px 14px rgba(0,0,0,.4), inset 0 1px 0 rgba(255,255,255,.1);
    transition: transform .08s, background .08s, box-shadow .08s; user-select: none; touch-action: none; }
  .dir-btn:active, .dir-btn.active { transform: scale(.92);
    background: linear-gradient(160deg, rgba(77,208,255,.45), rgba(138,255,214,.3));
    border-color: #8affd6; box-shadow: 0 0 18px rgba(138,255,214,.5); color: #fff; }
  .dir-up    { top: 4px;  left: 50%; transform: translateX(-50%); }
  .dir-down  { bottom: 4px; left: 50%; transform: translateX(-50%); }
  .dir-left  { left: 4px;  top: 50%; transform: translateY(-50%); }
  .dir-right { right: 4px; top: 50%; transform: translateY(-50%); }
  .dir-up:active,    .dir-up.active    { transform: translateX(-50%) scale(.92); }
  .dir-down:active,  .dir-down.active  { transform: translateX(-50%) scale(.92); }
  .dir-left:active,  .dir-left.active  { transform: translateY(-50%) scale(.92); }
  .dir-right:active, .dir-right.active { transform: translateY(-50%) scale(.92); }
  .disk-center { position: absolute; left: 50%; top: 50%; width: 46px; height: 46px; border-radius: 50%;
    transform: translate(-50%,-50%); background: rgba(77,208,255,.1);
    border: 1px solid rgba(138,255,214,.2); }

  /* 右边：技能按钮组 */
  .skill-panel { display: flex; flex-direction: column; gap: 12px; align-items: flex-end; pointer-events: auto; }
  .skill-row { display: flex; gap: 12px; }
  .skill-btn { position: relative; width: 64px; height: 64px; border-radius: 18px;
    background: linear-gradient(160deg, rgba(40,56,90,.9), rgba(18,26,46,.95));
    border: 1.5px solid rgba(77,208,255,.45); cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 4px 16px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.08);
    overflow: hidden; touch-action: none; transition: transform .08s, box-shadow .12s; }
  .skill-btn:active { transform: scale(.93); }
  .skill-btn.ready { box-shadow: 0 0 14px rgba(77,208,255,.35), inset 0 1px 0 rgba(255,255,255,.1); }
  .skill-btn .icon { font-size: 26px; color: #8affd6; text-shadow: 0 0 8px rgba(138,255,214,.6); z-index: 2; }
  .skill-btn.s-orbit .icon  { color: #bdffe6; text-shadow: 0 0 8px rgba(138,255,214,.7); }
  .skill-btn.s-aura  .icon  { color: #d9a8ff; text-shadow: 0 0 8px rgba(176,102,255,.7); }
  .skill-btn.s-ult   .icon  { color: #ffd86b; text-shadow: 0 0 8px rgba(255,210,80,.7); }
  /* CD 遮罩 */
  .skill-btn .cd-mask { position: absolute; inset: 0; background: rgba(5,8,16,.72);
    display: flex; align-items: center; justify-content: center; z-index: 3; pointer-events: none; }
  .skill-btn .cd-mask.hidden { display: none; }
  .skill-btn .cd-text { font-size: 18px; font-weight: 800; color: #fff; text-shadow: 0 1px 2px #000; }
  /* 冷却扇形进度（可选视觉） */
  .skill-btn .cd-fill { position: absolute; inset: 0; z-index: 1; pointer-events: none; }
  .skill-btn .key-hint { position: absolute; right: 4px; top: 3px; font-size: 10px; color: rgba(255,255,255,.4);
    font-weight: 700; z-index: 2; }
  .skill-btn .sk-name { position: absolute; bottom: 3px; left: 0; right: 0; text-align: center;
    font-size: 10px; color: rgba(200,208,220,.7); z-index: 2; letter-spacing: .5px; }

  .hint { position: absolute; bottom: 220px; left: 0; right: 0; text-align: center; font-size: 12px; color: rgba(154,166,184,.5); pointer-events: none; z-index: 4; }
</style>
</head>
<body>
<canvas id="game"></canvas>

<!-- 顶部状态 -->
<div id="hud">
  <div class="bar" id="hpBar"><i style="width:100%"></i></div>
  <div class="bar" id="xpBar"><i style="width:0%"></i></div>
  <div id="stats">
    <span>时间 <b id="tTime">0:00</b></span>
    <span>击杀 <b id="tKills">0</b></span>
    <span>波次 <b id="tWave">1</b></span>
  </div>
  <div id="lvBadge">Lv.<b id="tLv">1</b><br><span id="tXp" style="color:rgba(154,166,184,.6)">0/5</span></div>
</div>

<!-- 触屏摇杆（备选） -->
<div id="joy"><i></i></div>

<!-- 手游操作界面：左边圆盘方向键 + 右边技能按钮 -->
<div id="controls">
  <!-- 左边圆盘 -->
  <div class="direction-disk">
    <div class="disk-center"></div>
    <div class="dir-btn dir-up"    data-dir="up">▲</div>
    <div class="dir-btn dir-down"  data-dir="down">▼</div>
    <div class="dir-btn dir-left"  data-dir="left">◀</div>
    <div class="dir-btn dir-right" data-dir="right">▶</div>
  </div>
  <!-- 右边技能 -->
  <div class="skill-panel">
    <div class="skill-row">
      <div class="skill-btn s-bullet ready" data-skill="bullet" title="暗夜弹">
        <span class="key-hint">1</span>
        <div class="icon">✦</div>
        <span class="sk-name">弹幕</span>
        <div class="cd-mask hidden"><span class="cd-text">0.0</span></div>
      </div>
      <div class="skill-btn s-orbit" data-skill="orbit" title="护体光球">
        <span class="key-hint">2</span>
        <div class="icon">◉</div>
        <span class="sk-name">光球</span>
        <div class="cd-mask hidden"><span class="cd-text">0.0</span></div>
      </div>
    </div>
    <div class="skill-row">
      <div class="skill-btn s-aura" data-skill="aura" title="幽冥光环">
        <span class="key-hint">3</span>
        <div class="icon">◎</div>
        <span class="sk-name">光环</span>
        <div class="cd-mask hidden"><span class="cd-text">0.0</span></div>
      </div>
      <div class="skill-btn s-ult ready" data-skill="ult" title="终极爆发">
        <span class="key-hint">R</span>
        <div class="icon">✺</div>
        <span class="sk-name">爆发</span>
        <div class="cd-mask hidden"><span class="cd-text">0.0</span></div>
      </div>
    </div>
  </div>
</div>

<!-- 开始界面 -->
<div class="overlay show" id="startScreen">
  <h1>暗夜突围</h1>
  <p class="sub">N I G H T B R E A K</p>
  <p style="max-width:440px;font-size:13px;line-height:1.7;color:#aab4c6;margin-bottom:22px">
    敌人将从黑夜中不断涌来。<br>
    你的战机将自动释放弹幕，击杀敌人获取经验，升级时选择更强的技能。<br>
    活得越久，敌人越多越强。地图上偶有隐藏机遇，别错过。
  </p>
  <p style="font-size:12px;color:#8a93a6;margin-bottom:24px">
    电脑：WASD / 方向键移动 · 技能 1/2/3 / R 爆发<br>
    手机：左边圆盘控制方向 · 右边技能按钮释放
  </p>
  <button class="btn" id="btnStart">开始突围</button>
</div>

<!-- 升级界面 -->
<div class="overlay" id="levelScreen">
  <h1 style="font-size:24px">升 级</h1>
  <p class="sub">选择一项强化</p>
  <div id="cards"></div>
</div>

<!-- 死亡界面 -->
<div class="overlay" id="overScreen">
  <h1 style="color:#ff6b8a;text-shadow:0 0 20px rgba(255,77,109,.5)">突 围 失 败</h1>
  <p class="sub">你的战机坠毁在暗夜中</p>
  <div id="goStats"></div>
  <button class="btn" id="btnRetry">再次突围</button>
</div>

<div class="hint">移动靠近经验宝石即可拾取 · 升级时游戏暂停</div>

<script>
"use strict";
// ============ 暗夜突围 NightBreak - 战机版 ============

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
let W = 0, H = 0, DPR = Math.min(window.devicePixelRatio || 1, 2);

function resize() {
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = W * DPR; canvas.height = H * DPR;
  canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
window.addEventListener('resize', resize);
resize();

// ============ 工具函数 ============
const rand = (a, b) => a + Math.random() * (b - a);
const randi = (a, b) => Math.floor(rand(a, b + 1));
const dist2 = (ax, ay, bx, by) => { const dx = ax - bx, dy = ay - by; return dx * dx + dy * dy; };
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const TAU = Math.PI * 2;

// ============ 稀有度 ============
const RARITY = {
  common: { name: '普通', color: '#c8d0dc', weight: 50, mult: 1.0 },
  rare:   { name: '稀有', color: '#4dd0ff', weight: 30, mult: 1.6 },
  epic:   { name: '史诗', color: '#b066ff', weight: 15, mult: 2.2 },
  legend: { name: '传说', color: '#ffe27a', weight: 5,  mult: 3.5 },
};
function pickRarity() {
  const r = Math.random() * 100;
  let acc = 0;
  for (const k of ['common','rare','epic','legend']) {
    acc += RARITY[k].weight;
    if (r < acc) return k;
  }
  return 'common';
}

// ============ 游戏状态 ============
const STATE = { START: 0, PLAY: 1, LEVELUP: 2, OVER: 3 };
let state = STATE.START;

const cam = { x: 0, y: 0, shake: 0 };

const player = {
  x: 0, y: 0, r: 16,
  hp: 100, maxHp: 100,
  speed: 180,
  level: 1, xp: 0, xpNext: 5,
  kills: 0,
  invuln: 0,
  pickupRange: 90,
  facing: -Math.PI / 2, // 战机机头默认朝上（负y）
  regen: 0,
};

// ============ 技能系统（含按钮CD） ============
const skills = {
  bullet: { name: '暗夜弹',   icon: '✦', lvl: 1, dmg: 12, cd: 0.7, timer: 0, count: 1, pierce: 0, speed: 460, spread: 0.12, btnCd: 0, btnCdMax: 0 },
  orbit:  { name: '护体光球', icon: '◉', lvl: 0, dmg: 8,  count: 0, radius: 72, speed: 2.6, angle: 0, hitCd: {}, burstCd: 0, burstCdMax: 4.5 },
  aura:   { name: '幽冥光环', icon: '◎', lvl: 0, dmg: 6,  radius: 0, dps: 0, tick: 0, novaCd: 0, novaCdMax: 6.0 },
  ult:    { name: '终极爆发', icon: '✺', lvl: 0, cdMax: 20, cd: 0, dmg: 60, radius: 160 },
};

// 实体数组
let enemies = [], bullets = [], particles = [], gems = [], pickups = [], floats = [];
let time = 0;
let spawnTimer = 0;
let pickupTimer = 8;
let wave = 1;
let lastTime = 0;

// ============ 输入：键盘 + 圆盘 + 技能按钮 ============
const keys = {};
window.addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  keys[k] = true;
  // 技能快捷键
  if (k === '1') tryCastSkill('bullet');
  if (k === '2') tryCastSkill('orbit');
  if (k === '3') tryCastSkill('aura');
  if (k === 'r') tryCastSkill('ult');
});
window.addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });

// 圆盘方向键状态
const diskInput = { up: false, down: false, left: false, right: false };
function bindDirBtn(el, dir) {
  const down = (ev) => { ev.preventDefault(); diskInput[dir] = true; el.classList.add('active'); };
  const up   = (ev) => { ev.preventDefault(); diskInput[dir] = false; el.classList.remove('active'); };
  el.addEventListener('touchstart', down, { passive: false });
  el.addEventListener('touchend',   up,   { passive: false });
  el.addEventListener('touchcancel',up,   { passive: false });
  el.addEventListener('mousedown',  down);
  el.addEventListener('mouseup',    up);
  el.addEventListener('mouseleave', up);
}
document.querySelectorAll('.dir-btn').forEach(b => bindDirBtn(b, b.dataset.dir));

// 触屏拖动摇杆（保留兼容）
const joy = document.getElementById('joy');
const joyInner = joy.querySelector('i');
let touchId = null, joyCx = 0, joyCy = 0, joyVec = { x: 0, y: 0 };
const JOY_R = 46;

canvas.addEventListener('touchstart', e => {
  if (state !== STATE.PLAY || touchId !== null) return;
  // 只在画布左半边触发摇杆，避免与右边技能按钮冲突
  const t = e.changedTouches[0];
  if (t.clientX > W * 0.55) return;
  touchId = t.identifier;
  joyCx = t.clientX; joyCy = t.clientY;
  joy.style.left = joyCx + 'px'; joy.style.top = joyCy + 'px';
  joy.style.display = 'block';
  joyInner.style.transform = 'translate(-50%,-50%)';
  e.preventDefault();
}, { passive: false });

canvas.addEventListener('touchmove', e => {
  if (touchId === null) return;
  for (const t of e.changedTouches) {
    if (t.identifier === touchId) {
      let dx = t.clientX - joyCx, dy = t.clientY - joyCy;
      const d = Math.hypot(dx, dy);
      if (d > JOY_R) { dx = dx / d * JOY_R; dy = dy / d * JOY_R; }
      joyInner.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
      joyVec.x = dx / JOY_R; joyVec.y = dy / JOY_R;
      break;
    }
  }
  e.preventDefault();
}, { passive: false });

function endTouch(e) {
  for (const t of e.changedTouches) {
    if (t.identifier === touchId) {
      touchId = null; joyVec = { x: 0, y: 0 };
      joy.style.display = 'none';
      break;
    }
  }
}
canvas.addEventListener('touchend', endTouch, { passive: false });
canvas.addEventListener('touchcancel', endTouch, { passive: false });

// ============ 技能按钮点击/触摸 ============
function tryCastSkill(name) {
  if (state !== STATE.PLAY) return;
  const s = skills[name];
  if (!s) return;

  if (name === 'bullet') {
    // 按钮触发：立即打出一轮强化弹幕（小爆发），独立 CD 3s
    if (s.btnCd > 0) return;
    s.btnCd = 3.0; s.btnCdMax = 3.0;
    castBulletBurst();
  } else if (name === 'orbit') {
    if (s.lvl <= 0) return floatText(player.x, player.y - 28, '未解锁', '#8a93a6');
    if (s.burstCd > 0) return;
    s.burstCd = s.burstCdMax;
    castOrbitBurst();
  } else if (name === 'aura') {
    if (s.lvl <= 0) return floatText(player.x, player.y - 28, '未解锁', '#8a93a6');
    if (s.novaCd > 0) return;
    s.novaCd = s.novaCdMax;
    castAuraNova();
  } else if (name === 'ult') {
    if (s.cd > 0) return;
    s.cd = s.cdMax;
    castUlt();
  }
}

function castBulletBurst() {
  const b = skills.bullet;
  cam.shake = 5;
  // 360° 弹幕一圈 + 向前多发
  const ringN = 12;
  for (let i = 0; i < ringN; i++) {
    const a = (i / ringN) * TAU;
    bullets.push({
      x: player.x, y: player.y, r: 6,
      vx: Math.cos(a) * b.speed, vy: Math.sin(a) * b.speed,
      dmg: b.dmg * 1.4, pierce: 1, hit: new Set(), life: 1.4, color: '#ffe27a',
    });
  }
  spawnParticles(player.x, player.y, '#ffe27a', 16, 180);
  floatText(player.x, player.y - 28, '弹幕爆发!', '#ffe27a');
}
function castOrbitBurst() {
  const o = skills.orbit;
  cam.shake = 4;
  // 所有光球向外炸一圈
  for (let k = 0; k < o.count; k++) {
    const a = o.angle + (k / o.count) * TAU;
    const sx = player.x + Math.cos(a) * o.radius;
    const sy = player.y + Math.sin(a) * o.radius;
    for (let i = 0; i < 6; i++) {
      const aa = (i / 6) * TAU + a * 0.3;
      bullets.push({
        x: sx, y: sy, r: 5,
        vx: Math.cos(aa) * 380, vy: Math.sin(aa) * 380,
        dmg: o.dmg * 1.6, pierce: 0, hit: new Set(), life: 1.2, color: '#bdffe6',
      });

  }
  spawnParticles(player.x, player.y, '#8affd6', 20, 200);
  floatText(player.x, player.y - 28, '光球散射!', '#8affd6');
}
function castAuraNova() {
  const au = skills.aura;
  cam.shake = 6;
  // 光环范围内造成一次大伤害
  const r = au.radius + 40;

  spawnParticles(player.x, player.y, '#b066ff', 24, 220);

}
function castUlt() {
  const u = skills.ult;
  cam.shake = 16;

  for (let i = enemies.length - 1; i >= 0; i--) {

const ENEMY_TYPES = {
  grunt:  { r: 12, hp: 18, speed: 55,  dmg: 8,  xp: 1, color: '#ff5566', glow: '#ff3344' },
  runner: { r: 9,  hp: 10, speed: 100, dmg: 6,  xp: 1, color: '#ffa033', glow: '#ff7722' },
  tank:   { r: 20, hp: 70, speed: 35,  dmg: 16, xp: 4, color: '#b066ff', glow: '#9933ff' },
  brute:  { r: 16, hp: 40, speed: 70,  dmg: 12, xp: 2, color: '#ff3399', glow: '#ff1a88' },
};

function spawnEnemy() {
  const margin = 40;
  const side = randi(0, 3);
  let x, y;
  if (side === 0) { x = rand(-margin, W + margin); y = -margin; }
  else if (side === 1) { x = W + margin; y = rand(-margin, H + margin); }
  else if (side === 2) { x = rand(-margin, W + margin); y = H + margin; }
  else { x = -margin; y = rand(-margin, H + margin); }

  let type = 'grunt';
  const r = Math.random();
  if (time > 30 && r < 0.35) type = 'runner';
  if (time > 60 && r > 0.7 && r < 0.92) type = 'brute';
  if (time > 90 && r > 0.92) type = 'tank';
  if (time < 30) type = 'grunt';

  const t = ENEMY_TYPES[type];
  const hpScale = 1 + time / 60;
  const dmgScale = 1 + time / 120;
  enemies.push({
    type, x, y, r: t.r,
    hp: t.hp * hpScale, maxHp: t.hp * hpScale,
    speed: t.speed, dmg: t.dmg * dmgScale, xp: t.xp,
    color: t.color, glow: t.glow,
    hitFlash: 0, slow: 0,
  });
}

// ============ 主更新 ============
function update(dt) {
  time += dt;

  // 玩家移动（键盘 + 圆盘 + 摇杆）
  let mx = 0, my = 0;
  if (keys['a'] || keys['arrowleft'])  mx -= 1;
  if (keys['d'] || keys['arrowright']) mx += 1;
  if (keys['w'] || keys['arrowup'])    my -= 1;
  if (keys['s'] || keys['arrowdown'])  my += 1;
  if (diskInput.left)  mx -= 1;
  if (diskInput.right) mx += 1;
  if (diskInput.up)    my -= 1;
  if (diskInput.down)  my += 1;
  if (touchId !== null) { mx += joyVec.x; my += joyVec.y; }
  const ml = Math.hypot(mx, my);
  if (ml > 0.05) {
    mx /= Math.max(ml, 1); my /= Math.max(ml, 1);
    player.x += mx * player.speed * dt;
    player.y += my * player.speed * dt;
    // 机头朝向移动方向（带渐变过渡，避免抖动）
    const target = Math.atan2(my, mx);
    let d = target - player.facing;
    while (d >  Math.PI) d -= TAU;
    while (d < -Math.PI) d += TAU;
    player.facing += d * Math.min(1, dt * 10);
  }
  player.x = clamp(player.x, player.r, W - player.r);
  player.y = clamp(player.y, player.r, H - player.r - 180); // 底部留出操作区

  if (player.invuln > 0) player.invuln -= dt;
  if (player.regen > 0 && player.hp < player.maxHp) {
    player.hp = Math.min(player.maxHp, player.hp + player.regen * dt);
  }

  // === 技能按钮CD递减 ===
  if (skills.bullet.btnCd > 0) skills.bullet.btnCd = Math.max(0, skills.bullet.btnCd - dt);
  if (skills.orbit.burstCd > 0) skills.orbit.burstCd = Math.max(0, skills.orbit.burstCd - dt);
  if (skills.aura.novaCd > 0)  skills.aura.novaCd  = Math.max(0, skills.aura.novaCd  - dt);
  if (skills.ult.cd > 0)       skills.ult.cd       = Math.max(0, skills.ult.cd       - dt);
  updateSkillButtons();

  // === 敌人生成 ===
  spawnTimer -= dt;
  const targetCount = Math.min(8 + Math.floor(time / 4) * 2, 90);
  const spawnInterval = Math.max(0.25, 1.1 - time / 80);
  if (spawnTimer <= 0 && enemies.length < targetCount) {
    const batch = 1 + Math.floor(time / 30);
    for (let i = 0; i < batch && enemies.length < targetCount; i++) spawnEnemy();
    spawnTimer = spawnInterval;
  }
  wave = 1 + Math.floor(time / 20);

  // === 拾取物生成 ===
  pickupTimer -= dt;
  if (pickupTimer <= 0) {
    spawnPickup();
    pickupTimer = rand(12, 20);
  }

  // === 技能：暗夜弹（自动发射） ===
  const b = skills.bullet;
  if (b.lvl > 0) {
    b.timer -= dt;
    if (b.timer <= 0 && enemies.length > 0) {
      b.timer = b.cd;
      let best = null, bd = Infinity;
      for (const e of enemies) {
        const d = dist2(e.x, e.y, player.x, player.y);
        if (d < bd) { bd = d; best = e; }
      }
      if (best) {
        const baseAng = Math.atan2(best.y - player.y, best.x - player.x);
        const n = b.count;
        for (let i = 0; i < n; i++) {
          const off = (i - (n - 1) / 2) * b.spread;
          const a = baseAng + off;
          bullets.push({
            x: player.x, y: player.y, r: 5,
            vx: Math.cos(a) * b.speed, vy: Math.sin(a) * b.speed,
            dmg: b.dmg, pierce: b.pierce, hit: new Set(), life: 1.6, color: '#8affd6',
          });
        }
      }
    }
  }

  // === 技能：护体光球 ===
  const o = skills.orbit;
  if (o.count > 0) {
    o.angle += o.speed * dt;
    for (let i = 0; i < enemies.length; i++) {
      const e = enemies[i];
      for (let k = 0; k < o.count; k++) {
        const a = o.angle + (k / o.count) * TAU;
        const ox = player.x + Math.cos(a) * o.radius;
        const oy = player.y + Math.sin(a) * o.radius;
        if (dist2(ox, oy, e.x, e.y) < (12 + e.r) ** 2) {
          const key = i + '_' + k;
          if (!o.hitCd[key] || o.hitCd[key] <= 0) {
            damageEnemy(e, o.dmg, i);
            o.hitCd[key] = 0.5;
          }
        }
      }
    }
    for (const k in o.hitCd) { o.hitCd[k] -= dt; if (o.hitCd[k] <= 0) delete o.hitCd[k]; }
  }

  // === 技能：幽冥光环 ===
  const au = skills.aura;
  if (au.radius > 0) {
    au.tick -= dt;
    if (au.tick <= 0) {
      au.tick = 0.4;
      const r2 = au.radius * au.radius;
      for (let i = 0; i < enemies.length; i++) {
        const e = enemies[i];
        if (dist2(e.x, e.y, player.x, player.y) < r2) {
          damageEnemy(e, au.dps * 0.4, i, false);
        }
      }
    }
  }

  // === 子弹更新 + 命中 ===
  for (let i = bullets.length - 1; i >= 0; i--) {
    const bl = bullets[i];
    bl.x += bl.vx * dt; bl.y += bl.vy * dt; bl.life -= dt;
    if (bl.life <= 0 || bl.x < -20 || bl.x > W + 20 || bl.y < -20 || bl.y > H + 20) {
      bullets.splice(i, 1); continue;
    }
    for (let j = 0; j < enemies.length; j++) {
      const e = enemies[j];
      if (bl.hit.has(e)) continue;
      if (dist2(bl.x, bl.y, e.x, e.y) < (bl.r + e.r) ** 2) {
        damageEnemy(e, bl.dmg, j);
        bl.hit.add(e);
        if (bl.pierce <= 0) { bullets.splice(i, 1); break; }
        bl.pierce--;
      }
    }
  }

  // === 敌人更新 ===
  for (let i = enemies.length - 1; i >= 0; i--) {
    const e = enemies[i];
    if (e.hitFlash > 0) e.hitFlash -= dt;
    if (e.slow > 0) e.slow -= dt;
    const ang = Math.atan2(player.y - e.y, player.x - e.x);
    const sp = e.speed * (e.slow > 0 ? 0.5 : 1);
    e.x += Math.cos(ang) * sp * dt;
    e.y += Math.sin(ang) * sp * dt;
    if (player.invuln <= 0 && dist2(e.x, e.y, player.x, player.y) < (e.r + player.r) ** 2) {
      player.hp -= e.dmg;
      player.invuln = 0.6;
      cam.shake = 8;
      spawnParticles(player.x, player.y, '#ff4d6d', 8, 160);
      if (player.hp <= 0) { player.hp = 0; gameOver(); return; }
    }
  }

  // === 经验宝石 ===
  for (let i = gems.length - 1; i >= 0; i--) {
    const g = gems[i];
    g.life -= dt;
    if (g.life <= 0) { gems.splice(i, 1); continue; }
    const d2 = dist2(g.x, g.y, player.x, player.y);
    const pr = player.pickupRange;
    if (g.pull || d2 < pr * pr) {
      g.pull = true;
      const ang = Math.atan2(player.y - g.y, player.x - g.x);
      const pullSp = 260;
      g.x += Math.cos(ang) * pullSp * dt;
      g.y += Math.sin(ang) * pullSp * dt;
    } else {
      g.x += g.vx * dt; g.y += g.vy * dt;
      g.vx *= 0.92; g.vy *= 0.92;
    }
    if (d2 < (player.r + 8) ** 2) {
      gainXp(g.value);
      gems.splice(i, 1);
    }
  }

  // === 拾取物 ===
  for (let i = pickups.length - 1; i >= 0; i--) {
    const p = pickups[i];
    p.life -= dt; p.pulse += dt;
    if (p.life <= 0) { pickups.splice(i, 1); continue; }
    if (dist2(p.x, p.y, player.x, player.y) < (p.r + player.r) ** 2) {
      applyPickup(p);
      pickups.splice(i, 1);
    }
  }

  // === 粒子 ===
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    if (p.kind === 'ring') {
      p.life -= dt;
      if (p.life <= 0) particles.splice(i, 1);
    } else {
      p.x += p.vx * dt; p.y += p.vy * dt;
      p.vx *= 0.92; p.vy *= 0.92;
      p.life -= dt;
      if (p.life <= 0) particles.splice(i, 1);
    }
  }
  for (let i = floats.length - 1; i >= 0; i--) {
    const f = floats[i];
    f.y -= 30 * dt; f.life -= dt;
    if (f.life <= 0) floats.splice(i, 1);
  }

  if (cam.shake > 0) cam.shake -= dt * 30;
}

function updateSkillButtons() {
  const map = {
    bullet: { cd: skills.bullet.btnCd, max: skills.bullet.btnCdMax, enabled: true },
    orbit:  { cd: skills.orbit.burstCd, max: skills.orbit.burstCdMax, enabled: skills.orbit.lvl > 0 },
    aura:   { cd: skills.aura.novaCd,  max: skills.aura.novaCdMax,  enabled: skills.aura.lvl > 0 },
    ult:    { cd: skills.ult.cd,       max: skills.ult.cdMax,       enabled: true },
  };
  for (const [name, info] of Object.entries(map)) {
    const btn = document.querySelector(`.skill-btn[data-skill="${name}"]`);
    if (!btn) continue;
    const mask = btn.querySelector('.cd-mask');
    const txt  = btn.querySelector('.cd-text');
    // 未解锁：显示灰色
    btn.style.opacity = info.enabled ? 1 : 0.35;
    btn.style.filter = info.enabled ? 'none' : 'grayscale(.6)';
    btn.classList.toggle('ready', info.enabled && info.cd <= 0);
    if (info.cd > 0 && info.enabled) {
      mask.classList.remove('hidden');
      txt.textContent = info.cd.toFixed(1);
    } else {
      mask.classList.add('hidden');
    }
  }
}

function damageEnemy(e, dmg, idx, showNum) {
  e.hp -= dmg;
  e.hitFlash = 0.1;
  if (e.hp <= 0) killEnemy(e, idx);
}

function killEnemy(e, idx) {
  spawnParticles(e.x, e.y, e.color, 10, 200);
  spawnGem(e.x, e.y, e.xp);
  player.kills++;
  if (Math.random() < 0.02) spawnPickupAt(e.x, e.y);
  enemies.splice(idx, 1);
}

function applyPickup(p) {
  floatText(player.x, player.y - 20, p.name, p.color);
  spawnParticles(p.x, p.y, p.color, 16, 220);
  if (p.kind === 'heal') {
    player.hp = Math.min(player.maxHp, player.hp + 40);
  } else if (p.kind === 'magnet') {
    for (const g of gems) g.pull = true;
  } else if (p.kind === 'bomb') {
    cam.shake = 14;
    for (let i = enemies.length - 1; i >= 0; i--) {
      const e = enemies[i];
      damageEnemy(e, 40 + time * 0.5, i);
    }
    spawnParticles(player.x, player.y, '#ffaa33', 30, 300);
  } else if (p.kind === 'chest') {
    for (let i = 0; i < 6; i++) spawnGem(player.x + rand(-20,20), player.y + rand(-20,20), 2);
  }
}

function gainXp(v) {
  player.xp += v;
  while (player.xp >= player.xpNext) {
    player.xp -= player.xpNext;
    player.level++;
    player.xpNext = Math.floor(5 + player.level * 3 + player.level * player.level * 0.5);
    spawnParticles(player.x, player.y, '#8affd6', 20, 200);
    showLevelUp();
    return;
  }
}

function gameOver() {
  state = STATE.OVER;
  const m = Math.floor(time / 60), s = Math.floor(time % 60);
  document.getElementById('goStats').innerHTML =
    `<div class="k">存活时间</div><div class="v">${m}:${String(s).padStart(2,'0')}</div>` +
    `<div class="k">到达等级</div><div class="v">Lv.${player.level}</div>` +
    `<div class="k">击杀数</div><div class="v">${player.kills}</div>` +
    `<div class="k">波次</div><div class="v">${wave}</div>`;
  document.getElementById('overScreen').classList.add('show');
}

// ============ 渲染 ============
function drawBackground() {
  const g = ctx.createRadialGradient(player.x, player.y, 40, player.x, player.y, Math.max(W, H));
  g.addColorStop(0, '#11162a');
  g.addColorStop(0.5, '#0a0e1c');
  g.addColorStop(1, '#04050a');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);

  // 星点（视差）
  ctx.fillStyle = 'rgba(255,255,255,0.22)';
  for (let i = 0; i < 50; i++) {
    const x = (i * 137.5) % W, y = (i * 89.7 + ((time * 6) % H)) % H;
    ctx.fillRect(x, y, 1.5, 1.5);
  }
  // 远景星
  ctx.fillStyle = 'rgba(120,180,255,0.12)';
  for (let i = 0; i < 25; i++) {
    const x = ((i * 239.3) + time * 8) % W;
    const y = (i * 151.9) % H;
    ctx.fillRect(x, y, 2, 2);
  }
}

// ============ 战机造型（替换原圆形） ============
function drawPlayer() {
  ctx.save();
  // 光环
  if (skills.aura.radius > 0) {
    ctx.beginPath();
    ctx.arc(player.x, player.y, skills.aura.radius, 0, TAU);
    ctx.fillStyle = 'rgba(176,102,255,0.10)';
    ctx.fill();
    ctx.strokeStyle = 'rgba(176,102,255,0.35)';
    ctx.lineWidth = 1.5;
    ctx.stroke();
  }
  // 拾取范围
  ctx.beginPath();
  ctx.arc(player.x, player.y, player.pickupRange, 0, TAU);
  ctx.strokeStyle = 'rgba(138,255,214,0.06)';
  ctx.stroke();

  // 战机以机头方向为朝向，默认机头"向上"，因此把 facing + PI/2，使 Math.atan2(0,-1) = -PI/2 时战机垂直朝上
  ctx.translate(player.x, player.y);
  ctx.rotate(player.facing + Math.PI / 2);

  const blink = player.invuln > 0 && Math.floor(player.invuln * 20) % 2 === 0;
  const R = player.r; // 16

  // 尾焰（根据是否移动轻微抖动）
  ctx.save();
  ctx.shadowColor = '#4dd0ff'; ctx.shadowBlur = 22;
  const flameH = 14 + Math.sin(time * 60) * 3;
  const fg = ctx.createLinearGradient(0, R * 0.6, 0, R * 0.6 + flameH);
  fg.addColorStop(0, 'rgba(255,220,150,0.95)');
  fg.addColorStop(0.4, 'rgba(255,140,60,0.85)');
  fg.addColorStop(1, 'rgba(77,120,255,0)');
  ctx.fillStyle = fg;
  ctx.beginPath();
  ctx.moveTo(-R * 0.35, R * 0.55);
  ctx.quadraticCurveTo(0, R * 0.55 + flameH + 6, R * 0.35, R * 0.55);
  ctx.closePath();
  ctx.fill();
  // 双小引擎喷口
  ctx.fillStyle = 'rgba(150,220,255,0.85)';
  ctx.beginPath(); ctx.arc(-R * 0.42, R * 0.52, 2.2, 0, TAU); ctx.fill();
  ctx.beginPath(); ctx.arc( R * 0.42, R * 0.52, 2.2, 0, TAU); ctx.fill();
  ctx.restore();

  // 机身外发光
  ctx.shadowColor = '#4dd0ff';
  ctx.shadowBlur = blink ? 28 : 18;

  // 机翼（后掠翼，左右对称）
  ctx.fillStyle = blink ? '#ffffff' : '#36c6e8';
  ctx.beginPath();
  ctx.moveTo(-R * 1.6,  R * 0.35); // 翼尖左
  ctx.lineTo(-R * 0.55, R * 0.05); // 翼根左后
  ctx.lineTo(-R * 0.35, -R * 0.1); // 翼根左前
  ctx.lineTo(-R * 0.95, -R * 0.55); // 前缘转折
  ctx.lineTo(-R * 0.35, -R * 0.4);
  ctx.lineTo( R * 0.35, -R * 0.4);
  ctx.lineTo( R * 0.95, -R * 0.55);
  ctx.lineTo( R * 0.35, -R * 0.1);
  ctx.lineTo( R * 0.55, R * 0.05);
  ctx.lineTo( R * 1.6,  R * 0.35); // 翼尖右
  ctx.lineTo( R * 0.8,  R * 0.5);
  ctx.lineTo( R * 0.25, R * 0.6);
  ctx.lineTo(-R * 0.25, R * 0.6);
  ctx.lineTo(-R * 0.8,  R * 0.5);
  ctx.closePath();
  ctx.fill();

  ctx.shadowBlur = 0;

  // 机身中央金属高光
  const bodyGrad = ctx.createLinearGradient(0, -R, 0, R * 0.6);
  bodyGrad.addColorStop(0, blink ? '#fff' : '#7ee8ff');
  bodyGrad.addColorStop(0.5, blink ? '#e6faff' : '#2ca8cc');
  bodyGrad.addColorStop(1, '#12384a');
  ctx.fillStyle = bodyGrad;
  ctx.beginPath();
  ctx.moveTo(0, -R * 1.15);         // 机头最前
  ctx.quadraticCurveTo(R * 0.45, -R * 0.5, R * 0.35, R * 0.55);
  ctx.lineTo(-R * 0.35, R * 0.55);
  ctx.quadraticCurveTo(-R * 0.45, -R * 0.5, 0, -R * 1.15);
  ctx.closePath();
  ctx.fill();

  // 驾驶舱（深色玻璃，带高光）
  ctx.fillStyle = '#082433';
  ctx.beginPath();
  ctx.ellipse(0, -R * 0.15, R * 0.22, R * 0.42, 0, 0, TAU);
  ctx.fill();
  ctx.fillStyle = 'rgba(160,230,255,0.55)';
  ctx.beginPath();
  ctx.ellipse(-R * 0.06, -R * 0.28, R * 0.08, R * 0.16, 0, 0, TAU);
  ctx.fill();

  // 机翼装饰线
  ctx.strokeStyle = 'rgba(255,255,255,0.18)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(-R * 1.5, R * 0.3); ctx.lineTo(-R * 0.55, R * 0.08);
  ctx.moveTo( R * 1.5, R * 0.3); ctx.lineTo( R * 0.55, R * 0.08);
  ctx.moveTo(-R * 0.9, -R * 0.5); ctx.lineTo(-R * 0.4, -R * 0.38);
  ctx.moveTo( R * 0.9, -R * 0.5); ctx.lineTo( R * 0.4, -R * 0.38);
  ctx.stroke();

  ctx.restore();
}

function drawOrbit() {
  const o = skills.orbit;
  if (o.count === 0) return;
  for (let k = 0; k < o.count; k++) {
    const a = o.angle + (k / o.count) * TAU;
    const ox = player.x + Math.cos(a) * o.radius;
    const oy = player.y + Math.sin(a) * o.radius;
    ctx.save();
    ctx.shadowColor = '#8affd6'; ctx.shadowBlur = 16;
    // 光球本体（带拖尾感）
    const g = ctx.createRadialGradient(ox, oy, 0, ox, oy, 10);
    g.addColorStop(0, '#ffffff');
    g.addColorStop(0.5, '#bdffe6');
    g.addColorStop(1, 'rgba(138,255,214,0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(ox, oy, 10, 0, TAU); ctx.fill();
    ctx.restore();
  }
}

function drawEnemy(e) {
  ctx.save();
  ctx.shadowColor = e.glow; ctx.shadowBlur = 14;
  ctx.fillStyle = e.hitFlash > 0 ? '#ffffff' : e.color;
  ctx.beginPath();
  ctx.arc(e.x, e.y, e.r, 0, TAU);
  ctx.fill();
  ctx.shadowBlur = 0;
  // 内眼
  ctx.fillStyle = 'rgba(0,0,0,0.5)';
  ctx.beginPath();
  ctx.arc(e.x, e.y, e.r * 0.4, 0, TAU);
  ctx.fill();
  if (e.maxHp > 20 && e.hp < e.maxHp) {
    const w = e.r * 2;
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.fillRect(e.x - w / 2, e.y - e.r - 8, w, 3);
    ctx.fillStyle = '#ff5566';
    ctx.fillRect(e.x - w / 2, e.y - e.r - 8, w * (e.hp / e.maxHp), 3);
  }
  ctx.restore();
}

function drawBullet(b) {
  ctx.save();
  // 拖尾
  const len = 14;
  const sp = Math.hypot(b.vx, b.vy) || 1;
  const tx = b.x - (b.vx / sp) * len;
  const ty = b.y - (b.vy / sp) * len;
  const grad = ctx.createLinearGradient(tx, ty, b.x, b.y);
  grad.addColorStop(0, 'rgba(138,255,214,0)');
  grad.addColorStop(1, b.color);
  ctx.strokeStyle = grad;
  ctx.lineWidth = b.r * 1.6;
  ctx.lineCap = 'round';
  ctx.shadowColor = b.color; ctx.shadowBlur = 12;
  ctx.beginPath(); ctx.moveTo(tx, ty); ctx.lineTo(b.x, b.y); ctx.stroke();
  // 弹头
  ctx.fillStyle = b.color;
  ctx.beginPath();
  ctx.arc(b.x, b.y, b.r, 0, TAU);
  ctx.fill();
  ctx.restore();
}

function drawGem(g) {
  ctx.save();
  ctx.translate(g.x, g.y);
  ctx.rotate(time * 2);
  const s = 5;
  ctx.shadowColor = '#4dd0ff'; ctx.shadowBlur = 10;
  ctx.fillStyle = g.value >= 3 ? '#ffe27a' : '#7fe8ff';
  ctx.beginPath();
  ctx.moveTo(0, -s); ctx.lineTo(s, 0); ctx.lineTo(0, s); ctx.lineTo(-s, 0);
  ctx.closePath(); ctx.fill();
  ctx.restore();
}

function drawPickup(p) {
  ctx.save();
  const blink = p.life < 4 && Math.floor(p.life * 6) % 2 === 0;
  const pulse = 1 + Math.sin(p.pulse * 4) * 0.15;
  ctx.globalAlpha = blink ? 0.4 : 1;
  ctx.shadowColor = p.color; ctx.shadowBlur = 18;
  ctx.fillStyle = p.color;
  ctx.beginPath();
  ctx.arc(p.x, p.y, p.r * pulse, 0, TAU);
  ctx.fill();
  ctx.shadowBlur = 0;
  ctx.fillStyle = '#0a0e1c';
  ctx.font = 'bold 16px sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(p.icon, p.x, p.y + 1);
  ctx.restore();
}

function drawParticles() {
  for (const p of particles) {
    if (p.kind === 'ring') {
      const t = 1 - p.life / p.max;
      const rr = p.r0 + (p.r - p.r0) * t;
      ctx.globalAlpha = clamp(p.life / p.max, 0, 1);
      ctx.strokeStyle = p.color;
      ctx.lineWidth = 4 * (1 - t) + 1;
      ctx.shadowColor = p.color; ctx.shadowBlur = 16;
      ctx.beginPath(); ctx.arc(p.x, p.y, rr, 0, TAU); ctx.stroke();
      ctx.shadowBlur = 0;
    } else {
      ctx.globalAlpha = clamp(p.life / p.max, 0, 1);
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, TAU);
      ctx.fill();
    }
  }
  ctx.globalAlpha = 1;
}

function drawFloats() {
  ctx.textAlign = 'center';
  ctx.font = 'bold 14px sans-serif';
  for (const f of floats) {
    ctx.globalAlpha = clamp(f.life / f.max, 0, 1);
    ctx.fillStyle = f.color;
    ctx.shadowColor = '#000'; ctx.shadowBlur = 3;
    ctx.fillText(f.txt, f.x, f.y);
    ctx.shadowBlur = 0;
  }
  ctx.globalAlpha = 1;
}

function render() {
  ctx.save();
  if (cam.shake > 0) {
    ctx.translate(rand(-cam.shake, cam.shake), rand(-cam.shake, cam.shake));
  }
  drawBackground();
  for (const g of gems) drawGem(g);
  for (const p of pickups) drawPickup(p);
  for (const e of enemies) drawEnemy(e);
  drawOrbit();
  drawPlayer();
  for (const b of bullets) drawBullet(b);
  drawParticles();
  drawFloats();
  ctx.restore();
}

// ============ HUD 更新 ============
function updateHUD() {
  document.querySelector('#hpBar > i').style.width = (player.hp / player.maxHp * 100) + '%';
  document.querySelector('#xpBar > i').style.width = (player.xp / player.xpNext * 100) + '%';
  const m = Math.floor(time / 60), s = Math.floor(time % 60);
  document.getElementById('tTime').textContent = m + ':' + String(s).padStart(2, '0');
  document.getElementById('tKills').textContent = player.kills;
  document.getElementById('tWave').textContent = wave;
  document.getElementById('tLv').textContent = player.level;
  document.getElementById('tXp').textContent = Math.floor(player.xp) + '/' + player.xpNext;
}

// ============ 主循环 ============
function loop(ts) {
  if (!lastTime) lastTime = ts;
  let dt = (ts - lastTime) / 1000;
  lastTime = ts;
  if (dt > 0.05) dt = 0.05;

  if (state === STATE.PLAY) {
    update(dt);
  }
  if (state === STATE.PLAY || state === STATE.LEVELUP || state === STATE.OVER) {
    render();
    updateHUD();
  } else {
    drawBackground();
  }
  requestAnimationFrame(loop);
}

// ============ 按钮事件 ============
document.getElementById('btnStart').onclick = () => {
  resetGame();
  document.getElementById('startScreen').classList.remove('show');
  document.getElementById('controls').classList.add('show');
  state = STATE.PLAY;
};
document.getElementById('btnRetry').onclick = () => {
  resetGame();
  document.getElementById('overScreen').classList.remove('show');
  state = STATE.PLAY;
};

requestAnimationFrame(loop);
</script>
