<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>暗夜突围 NightBreak</title>
<meta property="og:title" content="暗夜突围 NightBreak">
<meta property="og:description" content="在暗夜中生存，杀出重围！一款刺激的生存类小游戏。">
<meta property="og:image" content="https://www.szkj.site/nightbreak/og-image.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="暗夜突围 NightBreak">
<meta name="twitter:description" content="在暗夜中生存，杀出重围！">
<meta name="twitter:image" content="https://www.szkj.site/nightbreak/og-image.jpg">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #05060a; touch-action: none; }
  canvas { display: block; position: absolute; top: 0; left: 0; }

  /* 横屏提示 */
  #rotateTip {
    position: fixed; inset: 0; z-index: 999;
    display: none; flex-direction: column; align-items: center; justify-content: center;
    background: #05060a; color: #d4c5a9; font-family: -apple-system, "PingFang SC", sans-serif;
    text-align: center; padding: 2rem;
  }
  #rotateTip .icon {
    font-size: 4rem; margin-bottom: 1.5rem;
    animation: rotatePhone 2s ease-in-out infinite;
  }
  #rotateTip h2 { font-size: 1.4rem; font-weight: 600; margin-bottom: 0.5rem; letter-spacing: 0.1em; }
  #rotateTip p { font-size: 0.9rem; color: #8a93a6; }
  @keyframes rotatePhone {
    0%, 100% { transform: rotate(0deg); }
    50% { transform: rotate(90deg); }
  }


</style>
</head>
<body>

<div id="rotateTip">
  <div class="icon">📱</div>
  <h2>请横屏游玩</h2>
  <p>旋转手机以获得最佳体验</p>
</div>


<script>
// ===== 横屏检测 =====
(function() {
  const tip = document.getElementById('rotateTip');
  const isMobile = /Mobi|Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
  
  function checkOrientation() {
    const isLandscape = window.innerWidth >= window.innerHeight;
    if (isMobile && !isLandscape) {
      tip.style.display = 'flex';
    } else {
      tip.style.display = 'none';
    }
  }

  // 尝试锁定横屏
  if (screen.orientation && screen.orientation.lock) {
    screen.orientation.lock('landscape').catch(() => {});
  }

  window.addEventListener('resize', checkOrientation);
  window.addEventListener('orientationchange', () => setTimeout(checkOrientation, 300));
  checkOrientation();
})();


</script>

<script>
// ===== 微信小游戏 API 适配层（Web 浏览器兼容） =====
(function() {
  let canvas = document.getElementById('gameCanvas');
  if (!canvas) {
    canvas = document.createElement('canvas');
    canvas.id = 'gameCanvas';
    document.body.appendChild(canvas);
  }

  let DPR = Math.min(window.devicePixelRatio || 1, 2);
  let W = window.innerWidth;
  let H = window.innerHeight;

  function resizeCanvas() {
    W = window.innerWidth;
    H = window.innerHeight;
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = W * DPR;
    canvas.height = H * DPR;
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
  }
  resizeCanvas();

  // wx 全局对象
  window.wx = {
    _mainCanvas: canvas,
    _canvasCount: 0,
    createCanvas() {
      this._canvasCount++;
      if (this._canvasCount === 1) return canvas;
      const c = document.createElement('canvas');
      c.width = W;
      c.height = H;
      return c;
    },
    getSystemInfoSync() {
      return {
        screenWidth: W,
        screenHeight: H,
        pixelRatio: DPR,
        safeArea: { left: 0, top: 0, right: W, bottom: H },
        platform: 'web',
        language: navigator.language || 'zh_CN',
      };
    },
    getMenuButtonBoundingClientRect() {
      return { bottom: 48, top: 4, left: W - 110, right: W - 10, width: 100, height: 32 };
    },
    createWebAudioContext() {
      try { return new (window.AudioContext || window.webkitAudioContext)(); } catch(e) { return null; }
    },
    createImage() {
      return new Image();
    },
    getStorageSync(key) {
      try { return localStorage.getItem('nightbreak_' + key) || ''; } catch(e) { return ''; }
    },
    setStorageSync(key, val) {
      try { localStorage.setItem('nightbreak_' + key, val); } catch(e) {}
    },
    login() {},
    shareAppMessage() {},
    showShareMenu() {},
    onShareAppMessage() {},
    onShow(cb) {
      document.addEventListener('visibilitychange', () => {
        if (!document.hidden) cb();
      });
    },
  };

  // 触摸事件适配
  const touchHandlerMap = {};
  function adaptTouchEvent(type, handler) {
    const wrapped = (e) => {
      e.preventDefault();
      const adaptedEvent = {
        touches: Array.from(e.touches).map(t => ({
          identifier: t.identifier,
          clientX: t.clientX,
          clientY: t.clientY,
          pageX: t.pageX,
          pageY: t.pageY,
        })),
        changedTouches: Array.from(e.changedTouches).map(t => ({
          identifier: t.identifier,
          clientX: t.clientX,
          clientY: t.clientY,
          pageX: t.pageX,
          pageY: t.pageY,
        })),
      };
      handler(adaptedEvent);
    };
    touchHandlerMap[type] = wrapped;
    canvas.addEventListener(type, wrapped, { passive: false });
  }

  wx.onTouchStart = (handler) => adaptTouchEvent('touchstart', handler);
  wx.onTouchMove = (handler) => adaptTouchEvent('touchmove', handler);
  wx.onTouchEnd = (handler) => adaptTouchEvent('touchend', handler);
  wx.onTouchCancel = (handler) => adaptTouchEvent('touchcancel', handler);

})();
</script>
<script src="game.js"></script>
</body>
</html>
