<head>
<meta charset="UTF-8">

<title>暗夜突围 NightBreak</title>
<meta property="og:title" content="暗夜突围 NightBreak">
<meta property="og:description" content="在暗夜中生存，杀出重围！一款刺激的生存类小游戏。">

<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #05060a; touch-action: none; }
  canvas { display: block; position: absolute; top: 0; left: 0; }

  /* 横屏提示 */
  #rotateTip {
    position: fixed; inset: 0; z-index: 999;
    display: none; flex-direction: column; align-items: center; justify-content: center;
    background: #05060a; color: #d4c5a9; font-family: -apple-system, "PingFang SC", sans-serif;
    text-align: center; padding: 2rem;
  }
  #rotateTip .icon {
    font-size: 4rem; margin-bottom: 1.5rem;
    animation: rotatePhone 2s ease-in-out infinite;
  }
  #rotateTip h2 { font-size: 1.4rem; font-weight: 600; margin-bottom: 0.5rem; letter-spacing: 0.1em; }
  #rotateTip p { font-size: 0.9rem; color: #8a93a6; }
  @keyframes rotatePhone {
    0%, 100% { transform: rotate(0deg); }
    50% { transform: rotate(90deg); }
  }


</style>
</head>
<body>

<div id="rotateTip">
  <div class="icon">📱</div>
  <h2>请横屏游玩</h2>
  <p>旋转手机以获得最佳体验</p>
</div>

<!-- 昵称输入浮层 -->
<div id="nameInputOverlay" style="display:none; position:fixed; inset:0; z-index:998; background:rgba(4,6,14,0.85); align-items:center; justify-content:center; font-family:-apple-system,'PingFang SC',sans-serif;">
  <div style="background:linear-gradient(180deg,#1a2238,#0e1424); border:1px solid rgba(77,208,255,0.4); border-radius:14px; padding:24px 22px; width:min(360px,86vw); box-shadow:0 0 32px rgba(77,208,255,0.25);">
    <div style="font-size:18px; font-weight:600; color:#8affd6; text-align:center; margin-bottom:6px; letter-spacing:0.1em;">修改昵称</div>
    <div style="font-size:11px; color:#8a93a6; text-align:center; margin-bottom:18px;">将显示在全国排行榜上（最多12字）</div>
    <input id="nameInputField" type="text" maxlength="12" placeholder="输入你的昵称"
      onkeydown="if(event.key==='Enter'){confirmNameInput();}else if(event.key==='Escape'){cancelNameInput();}"
      style="width:100%; box-sizing:border-box; padding:12px 14px; font-size:16px; color:#e8ecf3; background:rgba(8,12,24,0.9); border:1px solid rgba(77,208,255,0.3); border-radius:8px; outline:none;" />
    <div style="display:flex; gap:12px; margin-top:18px;">
      <button onclick="cancelNameInput()" style="flex:1; padding:11px; font-size:15px; color:#9aa6b8; background:rgba(40,48,68,0.6); border:1px solid rgba(120,130,150,0.3); border-radius:8px; cursor:pointer;">取消</button>
      <button onclick="confirmNameInput()" style="flex:1; padding:11px; font-size:15px; color:#04101a; font-weight:600; background:linear-gradient(90deg,#4dd0ff,#8affd6); border:none; border-radius:8px; cursor:pointer;">确认</button>
    </div>
  </div>
</div>


<script>
// ===== 横屏检测 =====
(function() {
  const tip = document.getElementById('rotateTip');
  const isMobile = /Mobi|Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
  
  function checkOrientation() {
    const isLandscape = window.innerWidth >= window.innerHeight;
    if (isMobile && !isLandscape) {
      tip.style.display = 'flex';
    } else {
      tip.style.display = 'none';
    }
  }

  // 尝试锁定横屏
  if (screen.orientation && screen.orientation.lock) {
    screen.orientation.lock('landscape').catch(() => {});
  }

  window.addEventListener('resize', checkOrientation);
  window.addEventListener('orientationchange', () => setTimeout(checkOrientation, 300));
  checkOrientation();
})();


</script>

<script>
// ===== 微信小游戏 API 适配层（Web 浏览器兼容） =====
(function() {
  let canvas = document.getElementById('gameCanvas');
  if (!canvas) {
    canvas = document.createElement('canvas');
    canvas.id = 'gameCanvas';
    document.body.appendChild(canvas);
  }

  let DPR = Math.min(window.devicePixelRatio || 1, 2);

  function resizeCanvas() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    // 注意：canvas 物理像素由 game.js 的 resizeScreen 负责，
    // 这里仅更新 DPR 缓存，避免与 game.js 重复设置造成冲突
  }
  resizeCanvas();

  // wx 全局对象
  window.wx = {
    _mainCanvas: canvas,
    _canvasCount: 0,
    createCanvas() {
      this._canvasCount++;
      if (this._canvasCount === 1) return canvas;
      const c = document.createElement('canvas');
      c.width = window.innerWidth;
      c.height = window.innerHeight;
      return c;
    },
    // 每次调用都返回实时屏幕尺寸（响应横竖屏切换/首次进入竞态）
    getSystemInfoSync() {
      const w = window.innerWidth, h = window.innerHeight;
      return {
        screenWidth: w,
        screenHeight: h,
        pixelRatio: Math.min(window.devicePixelRatio || 1, 2),
        safeArea: { left: 0, top: 0, right: w, bottom: h },
        platform: 'web',
        language: navigator.language || 'zh_CN',
      };
    },
    getMenuButtonBoundingClientRect() {
      return { bottom: 48, top: 4, left: window.innerWidth - 110, right: window.innerWidth - 10, width: 100, height: 32 };
    },
    createWebAudioContext() {
      try { return new (window.AudioContext || window.webkitAudioContext)(); } catch(e) { return null; }
    },
    createImage() {
      return new Image();
    },
    getStorageSync(key) {
      try { return localStorage.getItem('nightbreak_' + key) || ''; } catch(e) { return ''; }
    },
    setStorageSync(key, val) {
      try { localStorage.setItem('nightbreak_' + key, val); } catch(e) {}
    },
    login() {},
    shareAppMessage() {},
    showShareMenu() {},
    onShareAppMessage() {},
    onShow(cb) {
      document.addEventListener('visibilitychange', () => {
        if (!document.hidden) cb();
      });
    },
  };

  // 触摸事件适配
  const touchHandlerMap = {};
  function adaptTouchEvent(type, handler) {
    const wrapped = (e) => {
      e.preventDefault();
      const adaptedEvent = {
        touches: Array.from(e.touches).map(t => ({
          identifier: t.identifier,
          clientX: t.clientX,
          clientY: t.clientY,
          pageX: t.pageX,
          pageY: t.pageY,
        })),
        changedTouches: Array.from(e.changedTouches).map(t => ({
          identifier: t.identifier,
          clientX: t.clientX,
          clientY: t.clientY,
          pageX: t.pageX,
          pageY: t.pageY,
        })),
      };
      handler(adaptedEvent);
    };
    touchHandlerMap[type] = wrapped;
    canvas.addEventListener(type, wrapped, { passive: false });
  }

  wx.onTouchStart = (handler) => adaptTouchEvent('touchstart', handler);
  wx.onTouchMove = (handler) => adaptTouchEvent('touchmove', handler);
  wx.onTouchEnd = (handler) => adaptTouchEvent('touchend', handler);
  wx.onTouchCancel = (handler) => adaptTouchEvent('touchcancel', handler);

})();
</script>
<script src="game.js?v=20260802a"></script>
</body>
</html>
