<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>暗夜突围 NightBreak</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #05060a; font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; color: #e8ecf3; user-select: none; }
  #game { display: block; position: absolute; top: 0; left: 0; touch-action: none; }

  /* 顶部 HUD */
  #hud { position: absolute; top: 0; left: 0; right: 0; padding: 10px 14px; pointer-events: none; z-index: 5; }
  .bar { position: relative; height: 14px; background: rgba(255,255,255,0.08); border-radius: 8px; overflow: hidden; border: 1px solid rgba(255,255,255,0.12); }
  .bar > i { position: absolute; left: 0; top: 0; bottom: 0; display: block; border-radius: 8px; transition: width .12s linear; }
  #hpBar > i { background: linear-gradient(90deg, #ff4d6d, #ff8fa3); box-shadow: 0 0 12px #ff4d6d; }
  #xpBar { height: 8px; margin-top: 6px; }
  #xpBar > i { background: linear-gradient(90deg, #4dd0ff, #8affd6); box-shadow: 0 0 10px #4dd0ff; }
  #stats { display: flex; gap: 14px; margin-top: 8px; font-size: 13px; letter-spacing: .5px; }
  #stats b { color: #ffe27a; font-weight: 700; }
  #stats span { color: #9aa6b8; }
  #lvBadge { position: absolute; top: 8px; right: 12px; font-size: 12px; color: #8affd6; text-align: right; line-height: 1.5; }

  /* 遮罩层（升级 / 死亡 / 开始） */
  .overlay { position: absolute; inset: 0; z-index: 20; display: none; flex-direction: column; align-items: center; justify-content: center;
    background: radial-gradient(circle at 50% 40%, rgba(20,24,40,.7), rgba(5,6,10,.92)); backdrop-filter: blur(3px); padding: 24px; text-align: center; }
  .overlay.show { display: flex; }
  .overlay h1 { font-size: 30px; letter-spacing: 4px; margin-bottom: 6px; text-shadow: 0 0 20px rgba(77,208,255,.6); }
  .overlay p.sub { color: #8a93a6; font-size: 13px; margin-bottom: 22px; letter-spacing: 1px; }

  /* 升级卡片 */
  #cards { display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; max-width: 760px; }
  .card { width: 200px; background: linear-gradient(160deg, rgba(40,48,72,.95), rgba(18,22,38,.95)); border: 1px solid rgba(120,160,255,.25);
    border-radius: 14px; padding: 18px 16px; cursor: pointer; transition: transform .12s, box-shadow .12s, border-color .12s; pointer-events: auto; }
  .card:hover, .card:active { transform: translateY(-4px); border-color: rgba(138,255,214,.6); box-shadow: 0 8px 30px rgba(77,208,255,.18); }
  .card .icon { font-size: 30px; margin-bottom: 8px; }
  .card .name { font-size: 16px; font-weight: 700; margin-bottom: 4px; color: #ffe27a; }
  .card .lvl { font-size: 11px; color: #4dd0ff; margin-bottom: 8px; }
  .card .desc { font-size: 12px; color: #aab4c6; line-height: 1.5; }

  /* 死亡统计 */
  #goStats { display: grid; grid-template-columns: auto auto; gap: 8px 24px; margin: 14px 0 24px; font-size: 15px; }
  #goStats .k { color: #8a93a6; text-align: right; }
  #goStats .v { color: #ffe27a; font-weight: 700; text-align: left; }

  .btn { pointer-events: auto; background: linear-gradient(90deg, #4dd0ff, #8affd6); color: #06121a; border: none; border-radius: 10px;
    padding: 12px 30px; font-size: 16px; font-weight: 700; letter-spacing: 2px; cursor: pointer; box-shadow: 0 6px 20px rgba(77,208,255,.35); }
  .btn:active { transform: translateY(2px); }

  /* 摇杆 */
  #joy { position: absolute; z-index: 8; width: 120px; height: 120px; border-radius: 50%; border: 2px solid rgba(255,255,255,.18);
    background: rgba(255,255,255,.05); display: none; pointer-events: none; transform: translate(-50%,-50%); }
  #joy i { position: absolute; left: 50%; top: 50%; width: 54px; height: 54px; border-radius: 50%; transform: translate(-50%,-50%);
    background: rgba(138,255,214,.4); border: 2px solid rgba(138,255,214,.8); }

  .hint { position: absolute; bottom: 14px; left: 0; right: 0; text-align: center; font-size: 12px; color: rgba(154,166,184,.5); pointer-events: none; z-index: 4; }
</style>
</head>
<body>
<canvas id="game"></canvas>

<!-- 顶部状态 -->
<div id="hud">
  <div class="bar" id="hpBar"><i style="width:100%"></i></div>
  <div class="bar" id="xpBar"><i style="width:0%"></i></div>
  <div id="stats">
    <span>时间 <b id="tTime">0:00</b></span>
    <span>击杀 <b id="tKills">0</b></span>
    <span>波次 <b id="tWave">1</b></span>
  </div>
  <div id="lvBadge">Lv.<b id="tLv">1</b><br><span id="tXp" style="color:rgba(154,166,184,.6)">0/5</span></div>
</div>

<!-- 触屏摇杆 -->
<div id="joy"><i></i></div>

<!-- 开始界面 -->
<div class="overlay show" id="startScreen">
  <h1>暗夜突围</h1>
  <p class="sub">N I G H T B R E A K</p>
  <p style="max-width:440px;font-size:13px;line-height:1.7;color:#aab4c6;margin-bottom:22px">
    敌人将从黑夜中不断涌来。<br>
    你的技能会自动释放，击杀敌人获取经验，升级时选择更强的技能。<br>
    活得越久，敌人越多越强。地图上偶有隐藏机遇，别错过。
  </p>
  <p style="font-size:12px;color:#8a93a6;margin-bottom:24px">
    电脑：WASD / 方向键移动 &nbsp;·&nbsp; 手机：触屏拖动虚拟摇杆
  </p>
  <button class="btn" id="btnStart">开始突围</button>
</div>

<!-- 升级界面 -->
<div class="overlay" id="levelScreen">
  <h1 style="font-size:24px">升 级</h1>
  <p class="sub">选择一项强化</p>
  <div id="cards"></div>
</div>

<!-- 死亡界面 -->
<div class="overlay" id="overScreen">
  <h1 style="color:#ff6b8a;text-shadow:0 0 20px rgba(255,77,109,.5)">突 围 失 败</h1>
  <p class="sub">你倒在了暗夜之中</p>
  <div id="goStats"></div>
  <button class="btn" id="btnRetry">再次突围</button>
</div>

<div class="hint">移动靠近经验宝石即可拾取 · 升级时游戏暂停</div>

<script>
"use strict";
// ============ 暗夜突围 NightBreak - 单文件原型 ============

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
let W = 0, H = 0, DPR = Math.min(window.devicePixelRatio || 1, 2);

function resize() {
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = W * DPR; canvas.height = H * DPR;
  canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
window.addEventListener('resize', resize);
resize();

// ============ 工具函数 ============
const rand = (a, b) => a + Math.random() * (b - a);
const randi = (a, b) => Math.floor(rand(a, b + 1));
const dist2 = (ax, ay, bx, by) => { const dx = ax - bx, dy = ay - by; return dx * dx + dy * dy; };
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const TAU = Math.PI * 2;

// ============ 游戏状态 ============
const STATE = { START: 0, PLAY: 1, LEVELUP: 2, OVER: 3 };
let state = STATE.START;

// 世界用屏幕坐标，玩家固定在中心，世界随玩家"滚动" -> 简化为玩家可全屏移动，相机跟随
const cam = { x: 0, y: 0, shake: 0 };

const player = {
  x: 0, y: 0, r: 14,
  hp: 100, maxHp: 100,
  speed: 180,           // 像素/秒
  level: 1, xp: 0, xpNext: 5,
  kills: 0,
  invuln: 0,            // 受伤无敌时间
  pickupRange: 90,
  facing: 0,
  regen: 0,             // 每秒回血
};

// 技能系统：每种技能独立属性
const skills = {
  bullet: { name: '暗夜弹', icon: '✦', lvl: 1, dmg: 12, cd: 0.7, timer: 0, count: 1, pierce: 0, speed: 420, spread: 0.12 },
  orbit:  { name: '护体光球', icon: '◉', lvl: 0, dmg: 8, count: 0, radius: 70, speed: 2.4, angle: 0, hitCd: {} },
  aura:   { name: '幽冥光环', icon: '◎', lvl: 0, dmg: 6, radius: 0, dps: 0, tick: 0 },
};

// 实体数组
let enemies = [], bullets = [], particles = [], gems = [], pickups = [], floats = [];
let time = 0;            // 已存活秒数
let spawnTimer = 0;
let pickupTimer = 8;
let wave = 1;
let lastTime = 0;

// ============ 输入 ============
const keys = {};
window.addEventListener('keydown', e => { keys[e.key.toLowerCase()] = true; });
window.addEventListener('keyup',   e => { keys[e.key.toLowerCase()] = false; });

// 触屏摇杆
const joy = document.getElementById('joy');
const joyInner = joy.querySelector('i');
let touchId = null, joyCx = 0, joyCy = 0, joyVec = { x: 0, y: 0 };
const JOY_R = 46;

canvas.addEventListener('touchstart', e => {
  if (state !== STATE.PLAY || touchId !== null) return;
  const t = e.changedTouches[0];
  touchId = t.identifier;
  joyCx = t.clientX; joyCy = t.clientY;
  joy.style.left = joyCx + 'px'; joy.style.top = joyCy + 'px';
  joy.style.display = 'block';
  joyInner.style.transform = 'translate(-50%,-50%)';
  e.preventDefault();
}, { passive: false });

canvas.addEventListener('touchmove', e => {
  if (touchId === null) return;
  for (const t of e.changedTouches) {
    if (t.identifier === touchId) {
      let dx = t.clientX - joyCx, dy = t.clientY - joyCy;
      const d = Math.hypot(dx, dy);
      if (d > JOY_R) { dx = dx / d * JOY_R; dy = dy / d * JOY_R; }
      joyInner.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
      joyVec.x = dx / JOY_R; joyVec.y = dy / JOY_R;
      break;
    }
  }
  e.preventDefault();
}, { passive: false });

function endTouch(e) {
  for (const t of e.changedTouches) {
    if (t.identifier === touchId) {
      touchId = null; joyVec = { x: 0, y: 0 };
      joy.style.display = 'none';
      break;
    }
  }
}
canvas.addEventListener('touchend', endTouch, { passive: false });
canvas.addEventListener('touchcancel', endTouch, { passive: false });

// ============ 重置游戏 ============
function resetGame() {
  player.x = W / 2; player.y = H / 2;
  player.hp = 100; player.maxHp = 100; player.speed = 180;
  player.level = 1; player.xp = 0; player.xpNext = 5; player.kills = 0;
  player.invuln = 0; player.pickupRange = 90; player.regen = 0;
  skills.bullet = { name: '暗夜弹', icon: '✦', lvl: 1, dmg: 12, cd: 0.7, timer: 0, count: 1, pierce: 0, speed: 420, spread: 0.12 };
  skills.orbit  = { name: '护体光球', icon: '◉', lvl: 0, dmg: 8, count: 0, radius: 70, speed: 2.4, angle: 0, hitCd: {} };
  skills.aura   = { name: '幽冥光环', icon: '◎', lvl: 0, dmg: 6, radius: 0, dps: 0, tick: 0 };
  enemies = []; bullets = []; particles = []; gems = []; pickups = []; floats = [];
  time = 0; spawnTimer = 0; pickupTimer = 8; wave = 1; cam.shake = 0;
}

// ============ 敌人 ============
const ENEMY_TYPES = {
  grunt:  { r: 12, hp: 18, speed: 55,  dmg: 8,  xp: 1, color: '#ff5566', glow: '#ff3344' },
  runner: { r: 9,  hp: 10, speed: 100, dmg: 6,  xp: 1, color: '#ffa033', glow: '#ff7722' },
  tank:   { r: 20, hp: 70, speed: 35,  dmg: 16, xp: 4, color: '#b066ff', glow: '#9933ff' },
  brute:  { r: 16, hp: 40, speed: 70,  dmg: 12, xp: 2, color: '#ff3399', glow: '#ff1a88' },
};

function spawnEnemy() {
  // 从屏幕外四边生成
  const margin = 40;
  const side = randi(0, 3);
  let x, y;
  if (side === 0) { x = rand(-margin, W + margin); y = -margin; }
  else if (side === 1) { x = W + margin; y = rand(-margin, H + margin); }
  else if (side === 2) { x = rand(-margin, W + margin); y = H + margin; }
  else { x = -margin; y = rand(-margin, H + margin); }

  // 根据时间决定可出现的敌人种类
  let type = 'grunt';
  const r = Math.random();
  if (time > 30 && r < 0.35) type = 'runner';
  if (time > 60 && r > 0.7 && r < 0.92) type = 'brute';
  if (time > 90 && r > 0.92) type = 'tank';
  if (time < 30) type = 'grunt';

  const t = ENEMY_TYPES[type];
  // 难度缩放
  const hpScale = 1 + time / 60;
  const dmgScale = 1 + time / 120;
  enemies.push({
    type, x, y, r: t.r,
    hp: t.hp * hpScale, maxHp: t.hp * hpScale,
    speed: t.speed, dmg: t.dmg * dmgScale, xp: t.xp,
    color: t.color, glow: t.glow,
    hitFlash: 0, slow: 0,
  });
}

// ============ 粒子 ============
function spawnParticles(x, y, color, n, spd) {
  for (let i = 0; i < n; i++) {
    const a = rand(0, TAU), s = rand(spd * 0.3, spd);
    particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: rand(0.3, 0.7), max: 0.7, color, r: rand(1.5, 3.5) });
  }
}
function floatText(x, y, txt, color) {
  floats.push({ x, y, txt, color, life: 0.8, max: 0.8 });
}

// ============ 经验宝石 ============
function spawnGem(x, y, value) {
  gems.push({ x, y, vx: rand(-30, 30), vy: rand(-30, 30), value, life: 30, pull: false });
}

// ============ 拾取物（隐藏机遇） ============
const PICKUP_TYPES = [
  { kind: 'heal',  icon: '✚', color: '#5dff9b', name: '医疗包', desc: '恢复 40 点生命' },
  { kind: 'magnet',icon: '⩕', color: '#4dd0ff', name: '磁铁',  desc: '吸取全场经验宝石' },
  { kind: 'bomb',  icon: '✺', color: '#ffaa33', name: '爆裂符', desc: '对全场敌人造成伤害' },
  { kind: 'chest', icon: '◆', color: '#ffe27a', name: '宝箱',  desc: '获得大量经验' },
];
function spawnPickup() {
  const t = PICKUP_TYPES[randi(0, PICKUP_TYPES.length - 1)];
  pickups.push({
    ...t,
    x: rand(60, W - 60), y: rand(80, H - 80),
    r: 14, life: 18, pulse: 0,
  });
}

// ============ 升级技能池 ============
const UPGRADES = [
  { id: 'bDmg',  icon: '✦', name: '弹丸强化', desc: '暗夜弹伤害 +35%', apply: () => skills.bullet.dmg *= 1.35, maxLvl: 8, getLvl: () => skills.bullet.lvl },
  { id: 'bRate', icon: '⚡', name: '急速射击', desc: '暗夜弹射速 +20%', apply: () => skills.bullet.cd *= 0.8, maxLvl: 8, getLvl: () => 0 },
  { id: 'bCount',icon: '✲', name: '多重弹幕', desc: '暗夜弹数量 +1', apply: () => { skills.bullet.count += 1; skills.bullet.lvl++; }, maxLvl: 6, getLvl: () => skills.bullet.count - 1 },
  { id: 'bPierce',icon:'➳', name: '穿透弹头', desc: '暗夜弹穿透 +1', apply: () => { skills.bullet.pierce += 1; skills.bullet.lvl++; }, maxLvl: 4, getLvl: () => skills.bullet.pierce },
  { id: 'oNew',  icon: '◉', name: '护体光球', desc: '解锁环绕光球，撞击敌人', apply: () => { skills.orbit.count += 1; skills.orbit.lvl += 1; }, maxLvl: 6, getLvl: () => skills.orbit.count },
  { id: 'oDmg',  icon: '◎', name: '光球充能', desc: '光球伤害 +40%', apply: () => skills.orbit.dmg *= 1.4, maxLvl: 6, getLvl: () => skills.orbit.lvl },
  { id: 'aNew',  icon: '⊙', name: '幽冥光环', desc: '解锁周身伤害光环', apply: () => { skills.aura.radius = 70; skills.aura.dps = 12; skills.aura.lvl += 1; }, maxLvl: 5, getLvl: () => skills.aura.lvl },
  { id: 'aDmg',  icon: '◌', name: '光环扩散', desc: '光环范围与伤害提升', apply: () => { skills.aura.radius += 18; skills.aura.dps *= 1.3; skills.aura.lvl += 1; }, maxLvl: 5, getLvl: () => skills.aura.lvl },
  { id: 'pSpeed',icon: '⇶', name: '迅捷', desc: '移动速度 +12%', apply: () => player.speed *= 1.12, maxLvl: 6, getLvl: () => 0 },
  { id: 'pHp',   icon: '♥', name: '强健体魄', desc: '最大生命 +25 并回满', apply: () => { player.maxHp += 25; player.hp = player.maxHp; }, maxLvl: 8, getLvl: () => 0 },
  { id: 'pRange',icon: '◎', name: '吸取领域', desc: '经验拾取范围 +40%', apply: () => player.pickupRange *= 1.4, maxLvl: 5, getLvl: () => 0 },
  { id: 'pRegen',icon: '✚', name: '生命再生', desc: '每秒回复 1.5 点生命', apply: () => player.regen += 1.5, maxLvl: 5, getLvl: () => 0 },
];

const upgradeLevels = {};
function availableUpgrades() {
  return UPGRADES.filter(u => (upgradeLevels[u.id] || 0) < u.maxLvl);
}

function showLevelUp() {
  state = STATE.LEVELUP;
  const pool = availableUpgrades();
  // 随机抽 3 张
  const choices = [];
  const tmp = pool.slice();
  for (let i = 0; i < 3 && tmp.length; i++) {
    const idx = randi(0, tmp.length - 1);
    choices.push(tmp.splice(idx, 1)[0]);
  }
  const wrap = document.getElementById('cards');
  wrap.innerHTML = '';
  choices.forEach(u => {
    const cur = upgradeLevels[u.id] || 0;
    const el = document.createElement('div');
    el.className = 'card';
    el.innerHTML = `<div class="icon" style="color:${u.id.startsWith('a')?'#b066ff':u.id.startsWith('o')?'#8affd6':'#4dd0ff'}">${u.icon}</div>
      <div class="name">${u.name}</div>
      <div class="lvl">${u.getLvl() > 0 ? '当前 Lv.' + u.getLvl() + ' → Lv.' + (u.getLvl()+1) : '未拥有'}</div>
      <div class="desc">${u.desc}</div>`;
    el.onclick = () => {
      u.apply();
      upgradeLevels[u.id] = (upgradeLevels[u.id] || 0) + 1;
      document.getElementById('levelScreen').classList.remove('show');
      state = STATE.PLAY;
      cam.shake = 6;
    };
    wrap.appendChild(el);
  });
  document.getElementById('levelScreen').classList.add('show');
}

// ============ 主更新 ============
function update(dt) {
  time += dt;

  // 玩家移动
  let mx = 0, my = 0;
  if (keys['a'] || keys['arrowleft'])  mx -= 1;
  if (keys['d'] || keys['arrowright']) mx += 1;
  if (keys['w'] || keys['arrowup'])    my -= 1;
  if (keys['s'] || keys['arrowdown'])  my += 1;
  if (touchId !== null) { mx += joyVec.x; my += joyVec.y; }
  const ml = Math.hypot(mx, my);
  if (ml > 0.05) {
    mx /= Math.max(ml, 1); my /= Math.max(ml, 1);
    player.x += mx * player.speed * dt;
    player.y += my * player.speed * dt;
    player.facing = Math.atan2(my, mx);
  }
  player.x = clamp(player.x, player.r, W - player.r);
  player.y = clamp(player.y, player.r, H - player.r);

  if (player.invuln > 0) player.invuln -= dt;
  if (player.regen > 0 && player.hp < player.maxHp) {
    player.hp = Math.min(player.maxHp, player.hp + player.regen * dt);
  }

  // === 敌人生成 ===
  spawnTimer -= dt;
  const targetCount = Math.min(8 + Math.floor(time / 4) * 2, 90);
  const spawnInterval = Math.max(0.25, 1.1 - time / 80);
  if (spawnTimer <= 0 && enemies.length < targetCount) {
    const batch = 1 + Math.floor(time / 30);
    for (let i = 0; i < batch && enemies.length < targetCount; i++) spawnEnemy();
    spawnTimer = spawnInterval;
  }
  wave = 1 + Math.floor(time / 20);

  // === 拾取物生成 ===
  pickupTimer -= dt;
  if (pickupTimer <= 0) {
    spawnPickup();
    pickupTimer = rand(12, 20);
  }

  // === 技能：暗夜弹 ===
  const b = skills.bullet;
  if (b.lvl > 0) {
    b.timer -= dt;
    if (b.timer <= 0 && enemies.length > 0) {
      b.timer = b.cd;
      // 找最近敌人
      let best = null, bd = Infinity;
      for (const e of enemies) {
        const d = dist2(e.x, e.y, player.x, player.y);
        if (d < bd) { bd = d; best = e; }
      }
      if (best) {
        const baseAng = Math.atan2(best.y - player.y, best.x - player.x);
        const n = b.count;
        for (let i = 0; i < n; i++) {
          const off = (i - (n - 1) / 2) * b.spread;
          const a = baseAng + off;
          bullets.push({
            x: player.x, y: player.y, r: 5,
            vx: Math.cos(a) * b.speed, vy: Math.sin(a) * b.speed,
            dmg: b.dmg, pierce: b.pierce, hit: new Set(), life: 1.6, color: '#8affd6',
          });
        }
      }
    }
  }

  // === 技能：护体光球 ===
  const o = skills.orbit;
  if (o.count > 0) {
    o.angle += o.speed * dt;
    for (let i = 0; i < enemies.length; i++) {
      const e = enemies[i];
      for (let k = 0; k < o.count; k++) {
        const a = o.angle + (k / o.count) * TAU;
        const ox = player.x + Math.cos(a) * o.radius;
        const oy = player.y + Math.sin(a) * o.radius;
        if (dist2(ox, oy, e.x, e.y) < (o.radius * 0 + 12 + e.r) ** 2) {
          const key = i + '_' + k;
          if (!o.hitCd[key] || o.hitCd[key] <= 0) {
            damageEnemy(e, o.dmg, i);
            o.hitCd[key] = 0.5;
          }
        }
      }
    }
    // 冷却递减
    for (const k in o.hitCd) { o.hitCd[k] -= dt; if (o.hitCd[k] <= 0) delete o.hitCd[k]; }
  }

  // === 技能：幽冥光环 ===
  const au = skills.aura;
  if (au.radius > 0) {
    au.tick -= dt;
    if (au.tick <= 0) {
      au.tick = 0.4;
      const r2 = au.radius * au.radius;
      for (let i = 0; i < enemies.length; i++) {
        const e = enemies[i];
        if (dist2(e.x, e.y, player.x, player.y) < r2) {
          damageEnemy(e, au.dps * 0.4, i, false);
        }
      }
    }
  }

  // === 子弹更新 + 命中 ===
  for (let i = bullets.length - 1; i >= 0; i--) {
    const bl = bullets[i];
    bl.x += bl.vx * dt; bl.y += bl.vy * dt; bl.life -= dt;
    if (bl.life <= 0 || bl.x < -20 || bl.x > W + 20 || bl.y < -20 || bl.y > H + 20) {
      bullets.splice(i, 1); continue;
    }
    for (let j = 0; j < enemies.length; j++) {
      const e = enemies[j];
      if (bl.hit.has(e)) continue;
      if (dist2(bl.x, bl.y, e.x, e.y) < (bl.r + e.r) ** 2) {
        damageEnemy(e, bl.dmg, j);
        bl.hit.add(e);
        if (bl.pierce <= 0) { bullets.splice(i, 1); break; }
        bl.pierce--;
      }
    }
  }

  // === 敌人更新 ===
  for (let i = enemies.length - 1; i >= 0; i--) {
    const e = enemies[i];
    if (e.hitFlash > 0) e.hitFlash -= dt;
    if (e.slow > 0) e.slow -= dt;
    const ang = Math.atan2(player.y - e.y, player.x - e.x);
    const sp = e.speed * (e.slow > 0 ? 0.5 : 1);
    e.x += Math.cos(ang) * sp * dt;
    e.y += Math.sin(ang) * sp * dt;

    // 与玩家碰撞
    if (player.invuln <= 0 && dist2(e.x, e.y, player.x, player.y) < (e.r + player.r) ** 2) {
      player.hp -= e.dmg;
      player.invuln = 0.6;
      cam.shake = 8;
      spawnParticles(player.x, player.y, '#ff4d6d', 8, 160);
      if (player.hp <= 0) { player.hp = 0; gameOver(); return; }
    }
  }

  // === 经验宝石 ===
  for (let i = gems.length - 1; i >= 0; i--) {
    const g = gems[i];
    g.life -= dt;
    if (g.life <= 0) { gems.splice(i, 1); continue; }
    const d2 = dist2(g.x, g.y, player.x, player.y);
    const pr = player.pickupRange;
    if (g.pull || d2 < pr * pr) {
      g.pull = true;
      const ang = Math.atan2(player.y - g.y, player.x - g.x);
      const pullSp = 260;
      g.x += Math.cos(ang) * pullSp * dt;
      g.y += Math.sin(ang) * pullSp * dt;
    } else {
      g.x += g.vx * dt; g.y += g.vy * dt;
      g.vx *= 0.92; g.vy *= 0.92;
    }
    if (d2 < (player.r + 8) ** 2) {
      gainXp(g.value);
      gems.splice(i, 1);
    }
  }

  // === 拾取物 ===
  for (let i = pickups.length - 1; i >= 0; i--) {
    const p = pickups[i];
    p.life -= dt; p.pulse += dt;
    if (p.life <= 0) { pickups.splice(i, 1); continue; }
    if (dist2(p.x, p.y, player.x, player.y) < (p.r + player.r) ** 2) {
      applyPickup(p);
      pickups.splice(i, 1);
    }
  }

  // === 粒子 ===
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx * dt; p.y += p.vy * dt;
    p.vx *= 0.92; p.vy *= 0.92;
    p.life -= dt;
    if (p.life <= 0) particles.splice(i, 1);
  }
  // 浮动文字
  for (let i = floats.length - 1; i >= 0; i--) {
    const f = floats[i];
    f.y -= 30 * dt; f.life -= dt;
    if (f.life <= 0) floats.splice(i, 1);
  }

  if (cam.shake > 0) cam.shake -= dt * 30;
}

function damageEnemy(e, dmg, idx, showNum) {
  e.hp -= dmg;
  e.hitFlash = 0.1;
  if (showNum !== false) {/* 不显示伤害数字，避免太乱 */}
  if (e.hp <= 0) {
    killEnemy(e, idx);
  }
}

function killEnemy(e, idx) {
  spawnParticles(e.x, e.y, e.color, 10, 200);
  spawnGem(e.x, e.y, e.xp);
  player.kills++;
  // 5% 几率掉额外拾取
  if (Math.random() < 0.02) spawnPickupAt(e.x, e.y);
  enemies.splice(idx, 1);
}

function spawnPickupAt(x, y) {
  const t = PICKUP_TYPES[randi(0, PICKUP_TYPES.length - 1)];
  pickups.push({ ...t, x: clamp(x, 30, W - 30), y: clamp(y, 30, H - 30), r: 14, life: 15, pulse: 0 });
}

function applyPickup(p) {
  floatText(player.x, player.y - 20, p.name, p.color);
  spawnParticles(p.x, p.y, p.color, 16, 220);
  if (p.kind === 'heal') {
    player.hp = Math.min(player.maxHp, player.hp + 40);
  } else if (p.kind === 'magnet') {
    for (const g of gems) g.pull = true;
  } else if (p.kind === 'bomb') {
    cam.shake = 14;
    for (let i = enemies.length - 1; i >= 0; i--) {
      const e = enemies[i];
      damageEnemy(e, 40 + time * 0.5, i);
    }
    spawnParticles(player.x, player.y, '#ffaa33', 30, 300);
  } else if (p.kind === 'chest') {
    for (let i = 0; i < 6; i++) spawnGem(player.x + rand(-20,20), player.y + rand(-20,20), 2);
  }
}

function gainXp(v) {
  player.xp += v;
  while (player.xp >= player.xpNext) {
    player.xp -= player.xpNext;
    player.level++;
    player.xpNext = Math.floor(5 + player.level * 3 + player.level * player.level * 0.5);
    spawnParticles(player.x, player.y, '#8affd6', 20, 200);
    showLevelUp();
    return; // 一次只升一级界面
  }
}

function gameOver() {
  state = STATE.OVER;
  const m = Math.floor(time / 60), s = Math.floor(time % 60);
  document.getElementById('goStats').innerHTML =
    `<div class="k">存活时间</div><div class="v">${m}:${String(s).padStart(2,'0')}</div>` +
    `<div class="k">到达等级</div><div class="v">Lv.${player.level}</div>` +
    `<div class="k">击杀数</div><div class="v">${player.kills}</div>` +
    `<div class="k">波次</div><div class="v">${wave}</div>`;
  document.getElementById('overScreen').classList.add('show');
}

// ============ 渲染 ============
function drawBackground() {
  // 暗夜渐变
  const g = ctx.createRadialGradient(player.x, player.y, 40, player.x, player.y, Math.max(W, H));
  g.addColorStop(0, '#11162a');
  g.addColorStop(0.5, '#0a0e1c');
  g.addColorStop(1, '#04050a');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);

  // 星点
  ctx.fillStyle = 'rgba(255,255,255,0.25)';
  for (let i = 0; i < 40; i++) {
    const x = (i * 137.5) % W, y = (i * 89.7 + ((time * 4) % H)) % H;
    ctx.fillRect(x, y, 1.5, 1.5);
  }
}

function drawPlayer() {
  ctx.save();
  // 光环
  if (skills.aura.radius > 0) {
    ctx.beginPath();
    ctx.arc(player.x, player.y, skills.aura.radius, 0, TAU);
    ctx.fillStyle = 'rgba(176,102,255,0.10)';
    ctx.fill();
    ctx.strokeStyle = 'rgba(176,102,255,0.35)';
    ctx.lineWidth = 1.5;
    ctx.stroke();
  }
  // 拾取范围（淡）
  ctx.beginPath();
  ctx.arc(player.x, player.y, player.pickupRange, 0, TAU);
  ctx.strokeStyle = 'rgba(138,255,214,0.06)';
  ctx.stroke();

  // 玩家本体
  const blink = player.invuln > 0 && Math.floor(player.invuln * 20) % 2 === 0;
  ctx.shadowColor = '#4dd0ff';
  ctx.shadowBlur = 20;
  ctx.fillStyle = blink ? '#ffffff' : '#5fe1ff';
  ctx.beginPath();
  ctx.arc(player.x, player.y, player.r, 0, TAU);
  ctx.fill();
  ctx.shadowBlur = 0;
  ctx.fillStyle = '#0a1a26';
  ctx.beginPath();
  ctx.arc(player.x, player.y, player.r * 0.45, 0, TAU);
  ctx.fill();
  ctx.restore();
}

function drawOrbit() {
  const o = skills.orbit;
  if (o.count === 0) return;
  for (let k = 0; k < o.count; k++) {
    const a = o.angle + (k / o.count) * TAU;
    const ox = player.x + Math.cos(a) * o.radius;
    const oy = player.y + Math.sin(a) * o.radius;
    ctx.save();
    ctx.shadowColor = '#8affd6'; ctx.shadowBlur = 16;
    ctx.fillStyle = '#bdffe6';
    ctx.beginPath(); ctx.arc(ox, oy, 8, 0, TAU); ctx.fill();
    ctx.restore();
  }
}

function drawEnemy(e) {
  ctx.save();
  ctx.shadowColor = e.glow; ctx.shadowBlur = 14;
  ctx.fillStyle = e.hitFlash > 0 ? '#ffffff' : e.color;
  ctx.beginPath();
  ctx.arc(e.x, e.y, e.r, 0, TAU);
  ctx.fill();
  ctx.shadowBlur = 0;
  // 内眼
  ctx.fillStyle = 'rgba(0,0,0,0.5)';
  ctx.beginPath();
  ctx.arc(e.x, e.y, e.r * 0.4, 0, TAU);
  ctx.fill();
  // 血条（多血敌人）
  if (e.maxHp > 20 && e.hp < e.maxHp) {
    const w = e.r * 2;
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.fillRect(e.x - w / 2, e.y - e.r - 8, w, 3);
    ctx.fillStyle = '#ff5566';
    ctx.fillRect(e.x - w / 2, e.y - e.r - 8, w * (e.hp / e.maxHp), 3);
  }
  ctx.restore();
}

function drawBullet(b) {
  ctx.save();
  ctx.shadowColor = b.color; ctx.shadowBlur = 12;
  ctx.fillStyle = b.color;
  ctx.beginPath();
  ctx.arc(b.x, b.y, b.r, 0, TAU);
  ctx.fill();
  ctx.restore();
}

function drawGem(g) {
  ctx.save();
  ctx.translate(g.x, g.y);
  ctx.rotate(time * 2);
  const s = 5;
  ctx.shadowColor = '#4dd0ff'; ctx.shadowBlur = 10;
  ctx.fillStyle = g.value >= 3 ? '#ffe27a' : '#7fe8ff';
  ctx.beginPath();
  ctx.moveTo(0, -s); ctx.lineTo(s, 0); ctx.lineTo(0, s); ctx.lineTo(-s, 0);
  ctx.closePath(); ctx.fill();
  ctx.restore();
}

function drawPickup(p) {
  ctx.save();
  const blink = p.life < 4 && Math.floor(p.life * 6) % 2 === 0;
  const pulse = 1 + Math.sin(p.pulse * 4) * 0.15;
  ctx.globalAlpha = blink ? 0.4 : 1;
  ctx.shadowColor = p.color; ctx.shadowBlur = 18;
  ctx.fillStyle = p.color;
  ctx.beginPath();
  ctx.arc(p.x, p.y, p.r * pulse, 0, TAU);
  ctx.fill();
  ctx.shadowBlur = 0;
  ctx.fillStyle = '#0a0e1c';
  ctx.font = 'bold 16px sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(p.icon, p.x, p.y + 1);
  ctx.restore();
}

function drawParticles() {
  for (const p of particles) {
    ctx.globalAlpha = clamp(p.life / p.max, 0, 1);
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r, 0, TAU);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function drawFloats() {
  ctx.textAlign = 'center';
  ctx.font = 'bold 14px sans-serif';
  for (const f of floats) {
    ctx.globalAlpha = clamp(f.life / f.max, 0, 1);
    ctx.fillStyle = f.color;
    ctx.fillText(f.txt, f.x, f.y);
  }
  ctx.globalAlpha = 1;
}

function render() {
  ctx.save();
  if (cam.shake > 0) {
    ctx.translate(rand(-cam.shake, cam.shake), rand(-cam.shake, cam.shake));
  }
  drawBackground();
  for (const g of gems) drawGem(g);
  for (const p of pickups) drawPickup(p);
  for (const e of enemies) drawEnemy(e);
  drawOrbit();
  drawPlayer();
  for (const b of bullets) drawBullet(b);
  drawParticles();
  drawFloats();
  ctx.restore();
}

// ============ HUD 更新 ============
function updateHUD() {
  document.querySelector('#hpBar > i').style.width = (player.hp / player.maxHp * 100) + '%';
  document.querySelector('#xpBar > i').style.width = (player.xp / player.xpNext * 100) + '%';
  const m = Math.floor(time / 60), s = Math.floor(time % 60);
  document.getElementById('tTime').textContent = m + ':' + String(s).padStart(2, '0');
  document.getElementById('tKills').textContent = player.kills;
  document.getElementById('tWave').textContent = wave;
  document.getElementById('tLv').textContent = player.level;
  document.getElementById('tXp').textContent = Math.floor(player.xp) + '/' + player.xpNext;
}

// ============ 主循环 ============
function loop(ts) {
  if (!lastTime) lastTime = ts;
  let dt = (ts - lastTime) / 1000;
  lastTime = ts;
  if (dt > 0.05) dt = 0.05; // 防止卡顿跳帧

  if (state === STATE.PLAY) {
    update(dt);
  }
  if (state === STATE.PLAY || state === STATE.LEVELUP || state === STATE.OVER) {
    render();
    updateHUD();
  } else {
    // 开始界面也渲染个背景动画
    drawBackground();
  }
  requestAnimationFrame(loop);
}

// ============ 按钮事件 ============
document.getElementById('btnStart').onclick = () => {
  resetGame();
  document.getElementById('startScreen').classList.remove('show');
  state = STATE.PLAY;
};
document.getElementById('btnRetry').onclick = () => {
  resetGame();
  document.getElementById('overScreen').classList.remove('show');
  state = STATE.PLAY;
};

requestAnimationFrame(loop);
</script>
